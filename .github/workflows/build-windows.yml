name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ─────────────────────────────────────────────
      # Checkout Repository
      # ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      # ─────────────────────────────────────────────
      # Git LFS  (the .glb tooth model is large — keep if you use LFS)
      # ─────────────────────────────────────────────
      - name: Install Git LFS
        run: git lfs install --force

      - name: Pull LFS files
        run: git lfs pull --include "assets/*"

      # ─────────────────────────────────────────────
      # Setup Flutter
      # ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: false

      # ─────────────────────────────────────────────
      # Clean old lock file
      # ─────────────────────────────────────────────
      - name: Delete lock file
        shell: pwsh
        run: |
          Remove-Item pubspec.lock -ErrorAction SilentlyContinue

      # ─────────────────────────────────────────────
      # Install Dependencies
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────
      # Google Drive config — the real file is NOT in Git (it holds the
      # client secret). Made here from the repo's secrets:
      # Settings → Secrets and variables → Actions
      #   DRIVE_CLIENT_ID, DRIVE_CLIENT_SECRET
      # ─────────────────────────────────────────────
      - name: Create Drive config from secrets
        shell: pwsh
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
        run: |
          if (-not $env:DRIVE_CLIENT_ID -or -not $env:DRIVE_CLIENT_SECRET) { throw "Add DRIVE_CLIENT_ID and DRIVE_CLIENT_SECRET under GitHub Settings > Secrets and variables > Actions" }
          $src = 'lib/features/drive/data/drive_config.example.dart'
          $out = 'lib/features/drive/data/drive_config.dart'
          if (-not (Test-Path $src)) { throw "$src is missing - commit the example file" }
          $text = (Get-Content $src -Raw).Replace('PASTE_CLIENT_ID.apps.googleusercontent.com', $env:DRIVE_CLIENT_ID).Replace("'PASTE_CLIENT_SECRET'", "'$env:DRIVE_CLIENT_SECRET'")
          if ($text -match 'PASTE_CLIENT') { throw "Drive config was not filled in - check the example file's placeholders" }
          Set-Content -Path $out -Value $text -NoNewline
          Write-Host "Drive config created."

      # ─────────────────────────────────────────────
      # Generate code (Drift + freezed) — REQUIRED for DentOS
      # ─────────────────────────────────────────────
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ─────────────────────────────────────────────
      # Build Windows EXE
      # ─────────────────────────────────────────────
      - name: Build Windows EXE
        shell: pwsh
        run: |
          Write-Host "Building DentOS Windows executable..."
          flutter build windows --release
          Write-Host "Build completed!"

      # ─────────────────────────────────────────────
      # NEW: Create MSIX for Microsoft Store
      # - reuses the build above (--build-windows false)
      # - version auto-increments every run: 1.0.<run number>.0
      #   (last number must stay 0 for the Store)
      # - saved to build/msix so it doesn't end up inside the ZIP
      # ─────────────────────────────────────────────
      - name: Create MSIX
        shell: pwsh
        run: dart run msix:create --build-windows false --version 1.0.${{ github.run_number }}.0 --output-path build/msix --output-name DentOS

      # ─────────────────────────────────────────────
      # NEW: Upload MSIX so you can download it from the run page
      # and upload it to Partner Center
      # ─────────────────────────────────────────────
      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentOS-msix
          path: build/msix/DentOS.msix
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────────────────────
      # Create ZIP (keep until all clinics have moved to the Store)
      # ─────────────────────────────────────────────
      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath DentOS.zip `
            -Force

          Write-Host "ZIP created successfully"

      # ─────────────────────────────────────────────
      # Setup Node.js
      # ─────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ─────────────────────────────────────────────
      # Install Vercel Blob SDK
      # ─────────────────────────────────────────────
      - name: Install Vercel Blob SDK
        run: npm install @vercel/blob

      # ─────────────────────────────────────────────
      # Upload ZIP to Vercel Blob
      # ─────────────────────────────────────────────
      - name: Upload ZIP to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
        run: |
          node -e "
          const { put } = require('@vercel/blob');
          const fs = require('fs');

          async function uploadZip() {
            const zipBuffer = fs.readFileSync('DentOS.zip');

            const blob = await put('DentOS.zip', zipBuffer, {
              access: 'public',
              addRandomSuffix: false,
              allowOverwrite: true,
            });

            console.log('Uploaded ZIP to: ' + blob.url);
          }

          uploadZip().catch(err => {
            console.error('Upload failed:', err);
            process.exit(1);
          });
          "

      # ─────────────────────────────────────────────
      # Upload Build Artifact to GitHub
      # ─────────────────────────────────────────────
      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DentOS
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7